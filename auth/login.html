<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login · Kitchen Queen Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
  <link rel="stylesheet" href="../assets/css/style.css" />
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <div class="brand-row">
        <img src="../images/logo.svg" alt="Kitchen Queen" />
        <div>
          <h1>Kitchen Queen</h1>
          <p>Staff login</p>
        </div>
      </div>
      <h2>Welcome back</h2>
      <p class="sub">Name, email aur WhatsApp number se login.</p>
      <form id="loginForm">
        <div class="field">
          <label>Full Name</label>
          <input type="text" id="name" required placeholder="Queen Admin" />
        </div>
        <div class="field">
          <label>Email</label>
          <input type="email" id="email" required placeholder="queen@kitchenqueen.pk" />
        </div>
        <div class="field">
          <label>Phone Number</label>
          <input type="tel" id="phone" required placeholder="03xx-xxxxxxx" />
        </div>
        <button class="btn btn-gold" type="submit"><i class="bi bi-whatsapp"></i> Send WhatsApp OTP</button>
      </form>
      <div class="auth-foot">First time? <a href="register.html">Register here</a></div>
    </div>
  </div>
  <script src="../assets/js/data.js"></script>
  <script src="../assets/js/app.js"></script>
  <script>
    document.getElementById("loginForm").addEventListener("submit", (e) => {
      e.preventDefault();
      const name = document.getElementById("name").value.trim();
      const email = document.getElementById("email").value.trim().toLowerCase();
      const phone = document.getElementById("phone").value.trim();
      const acc = JSON.parse(localStorage.getItem("kq_account") || "null");
      if (acc && acc.email !== email) {
        alert("Yeh email registered nahi hai. Pehle register karein ya wahi email use karein.");
        return;
      }
      const otp = String(Math.floor(100000 + Math.random() * 900000));
      sessionStorage.setItem("kq_pending_otp", otp);
      KQApp.saveSession({ name, email, phone, verified: false });
      alert("Demo WhatsApp OTP: " + otp + "\n(Verify page par yeh code enter karein)");
      location.href = "verify.html";
    });
  </script>
</body>
</html>
