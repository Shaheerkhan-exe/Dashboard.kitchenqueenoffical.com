<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Register · Kitchen Queen Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
  <link rel="stylesheet" href="../assets/css/style.css" />
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <div class="brand-row">
        <img src="../images/logo.svg" alt="Kitchen Queen" />
        <div>
          <h1>Kitchen Queen</h1>
          <p>Admin first setup</p>
        </div>
      </div>
      <h2>Create admin account</h2>
      <p class="sub">Email and password sirf pehli dafa setup ke liye.</p>
      <form id="regForm">
        <div class="field">
          <label>Email</label>
          <input type="email" id="email" required placeholder="queen@kitchenqueen.pk" />
        </div>
        <div class="field">
          <label>Password</label>
          <input type="password" id="password" required minlength="6" placeholder="Min 6 characters" />
        </div>
        <button class="btn btn-gold" type="submit">Register & Continue</button>
      </form>
      <div class="auth-foot">Already registered? <a href="login.html">Login</a></div>
    </div>
  </div>
  <script src="../assets/js/data.js"></script>
  <script src="../assets/js/app.js"></script>
  <script>
    document.getElementById("regForm").addEventListener("submit", (e) => {
      e.preventDefault();
      const email = document.getElementById("email").value.trim().toLowerCase();
      const password = document.getElementById("password").value;
      localStorage.setItem("kq_account", JSON.stringify({ email, password }));
      localStorage.removeItem("kq_admin_session");
      alert("Account created. Ab login karein.");
      location.href = "login.html";
    });
  </script>
</body>
</html>
