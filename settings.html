<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Settings · Kitchen Queen Admin</title>
  <link rel="icon" type="image/png" href="favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body data-title="Store Settings">
  <div id="page">
    <div class="grid g-2">
      <div class="card">
        <h3 class="section-title" style="margin-top:0">Admin Profile</h3>
        <div class="field"><label>Store Name</label><input id="store" /></div>
        <div class="field"><label>Contact Email</label><input id="email" type="email" /></div>
        <div class="field"><label>Phone Numbers</label><input id="phone" /></div>
        <div class="field"><label>New Admin Password</label><input id="pass" type="password" placeholder="Leave blank to keep" /></div>
        <button class="btn btn-gold" id="saveProfile">Save Profile</button>
      </div>
      <div class="card">
        <h3 class="section-title" style="margin-top:0">Holiday / Event Close</h3>
        <p style="color:var(--muted);font-size:13px">Temporarily close the kitchen for Eid, rain delay or a special event.</p>
        <div class="field"><label>Closed Date</label><input type="date" id="hdate" /></div>
        <div class="field"><label>Reason</label><input id="hreason" placeholder="Eid ul Fitr / Heavy rain" /></div>
        <button class="btn btn-red btn-sm" id="addHol">Add Holiday</button>
        <div id="hols" style="margin-top:12px"></div>
      </div>
    </div>
  </div>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/app.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const s = KQApp.settings();
      document.getElementById("store").value = s.store;
      document.getElementById("email").value = s.email;
      document.getElementById("phone").value = s.phone;
      function paintHols() {
        const set = KQApp.settings();
        document.getElementById("hols").innerHTML = (set.holidays||[]).map((h,i)=>`
          <div class="alert-item"><span class="badge b-cancelled">${h.date}</span><div>${h.reason}</div>
          <button class="btn btn-ghost btn-sm" onclick="delHol(${i})">Remove</button></div>`).join("") || "<p style='color:var(--muted)'>No holidays set.</p>";
      }
      paintHols();
      window.delHol = (i) => {
        const set = KQApp.settings();
        set.holidays.splice(i,1);
        KQApp.saveSettings(set);
        paintHols();
      };
      document.getElementById("addHol").onclick = () => {
        const date = document.getElementById("hdate").value;
        const reason = document.getElementById("hreason").value.trim() || "Closed";
        if (!date) return alert("Please choose a date.");
        const set = KQApp.settings();
        set.holidays = set.holidays || [];
        set.holidays.push({ date, reason });
        KQApp.saveSettings(set);
        paintHols();
        KQApp.toast("Holiday saved");
      };
      document.getElementById("saveProfile").onclick = () => {
        const set = KQApp.settings();
        set.store = document.getElementById("store").value;
        set.email = document.getElementById("email").value;
        set.phone = document.getElementById("phone").value;
        const pass = document.getElementById("pass").value;
        if (pass) {
          const acc = JSON.parse(localStorage.getItem("kq_account") || "{}");
          acc.password = pass;
          localStorage.setItem("kq_account", JSON.stringify(acc));
        }
        KQApp.saveSettings(set);
        KQApp.toast("Profile updated");
      };
    });
  </script>
</body>
</html>
