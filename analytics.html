<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Analytics · Kitchen Queen Admin</title>
  <link rel="icon" type="image/png" href="favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body data-title="Sales Analytics">
  <div id="page">
    <div class="card">
      <div class="section-title">
        <h3>Sales Overview</h3>
        <div class="tabs">
          <button class="tab active" data-p="daily">Daily</button>
          <button class="tab" data-p="weekly">Weekly</button>
          <button class="tab" data-p="monthly">Monthly</button>
        </div>
      </div>
      <canvas id="salesChart" height="110"></canvas>
    </div>
    <div class="grid g-2" style="margin-top:16px">
      <div class="card">
        <h3 class="section-title" style="margin-top:0">Payment Mode</h3>
        <canvas id="payChart" height="180"></canvas>
      </div>
      <div class="card">
        <h3 class="section-title" style="margin-top:0">Peak Hours Heatmap</h3>
        <canvas id="peakChart" height="180"></canvas>
      </div>
    </div>
    <div class="card" style="margin-top:16px">
      <div class="section-title"><h3>Top-Selling Menu Items</h3></div>
      <div class="table-wrap">
        <table class="data" id="top"></table>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/app.js"></script>
  <script>
    const gold = "#ffc107", accent = "#f3a812";
    Chart.defaults.color = "#6f6f6f";
    Chart.defaults.borderColor = "rgba(243,168,18,.18)";
    let salesChart;
    function makeSales(period) {
      const cfg = {
        daily: { labels: ["Thu","Fri","Sat","Sun","Mon","Tue","Wed"], data: KQ.SALES_DAILY, type: "line" },
        weekly: { labels: ["W1","W2","W3","W4","W5","W6","W7"], data: KQ.SALES_WEEKLY, type: "bar" },
        monthly: { labels: ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"], data: KQ.SALES_MONTHLY, type: "bar" }
      }[period];
      if (salesChart) salesChart.destroy();
      salesChart = new Chart(document.getElementById("salesChart"), {
        type: cfg.type,
        data: { labels: cfg.labels, datasets: [{ label: "Sales (PKR)", data: cfg.data, borderColor: accent, backgroundColor: period==="daily"?"rgba(255,193,7,.22)":"rgba(255,193,7,.75)", fill: true, tension: .35, borderRadius: 8 }] },
        options: { plugins: { legend: { display: false } }, scales: { y: { ticks: { callback: v => v.toLocaleString() } } } }
      });
    }
    document.addEventListener("DOMContentLoaded", () => {
      makeSales("daily");
      document.querySelectorAll("[data-p]").forEach(b => b.onclick = () => {
        document.querySelectorAll("[data-p]").forEach(x => x.classList.remove("active"));
        b.classList.add("active");
        makeSales(b.dataset.p);
      });
      const cash = KQ.ORDERS.filter(o => o.payment === "COD" && o.status === "Completed").reduce((s,o)=>s+o.net,0);
      const online = KQ.ORDERS.filter(o => o.payment !== "COD" && o.status === "Completed").reduce((s,o)=>s+o.net,0);
      new Chart(document.getElementById("payChart"), {
        type: "doughnut",
        data: { labels: ["Cash on Delivery", "EasyPaisa / JazzCash"], datasets: [{ data: [cash || 3200, online || 5100], backgroundColor: [gold, accent], borderWidth: 0 }] },
        options: { plugins: { legend: { position: "bottom" } } }
      });
      new Chart(document.getElementById("peakChart"), {
        type: "bar",
        data: { labels: [...Array(24)].map((_,i)=>i+":00"), datasets: [{ label: "Orders", data: KQ.PEAK_HOURS, backgroundColor: KQ.PEAK_HOURS.map(v => v>24?"#e03131":gold) }] },
        options: { plugins: { legend: { display: false } }, scales: { x: { ticks: { maxRotation: 0, autoSkip: true, maxTicksLimit: 12 } } } }
      });
      const top = [...KQApp.menu()].sort((a,b)=>b.sold-a.sold).slice(0,8);
      document.getElementById("top").innerHTML = `<thead><tr><th>#</th><th>Dish</th><th>Units</th><th>Revenue</th></tr></thead><tbody>` +
        top.map((m,i)=>`<tr><td>${i+1}</td><td>${m.name}</td><td>${m.sold}</td><td>${KQApp.fmtPKR(m.revenue)}</td></tr>`).join("") + "</tbody>";
    });
  </script>
</body>
</html>
