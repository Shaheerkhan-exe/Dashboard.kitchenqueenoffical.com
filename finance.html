<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Finance · Kitchen Queen Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body data-title="Finance & Invoices">
  <div id="page">
    <div class="grid g-3" id="sum"></div>
    <div class="card" style="margin-top:16px">
      <div class="section-title">
        <h3>Payout history</h3>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <button class="btn btn-gold btn-sm" id="xlsxBtn"><i class="bi bi-file-earmark-spreadsheet"></i> Export Excel</button>
          <button class="btn btn-red btn-sm" id="pdfBtn"><i class="bi bi-printer"></i> Print Invoice PDF</button>
        </div>
      </div>
      <div class="table-wrap">
        <table class="data" id="tbl"></table>
      </div>
    </div>
  </div>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/app.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const done = KQ.ORDERS.filter(o => o.status === "Completed");
      const week = done.filter(o => o.date >= "2026-09-04");
      const month = done.filter(o => o.date.startsWith("2026-09") || o.date.startsWith("2026-08"));
      const wTot = week.reduce((s,o)=>s+o.net,0);
      const mTot = month.reduce((s,o)=>s+o.net,0);
      document.getElementById("sum").innerHTML = `
        <div class="card stat"><div><p>This Week Earnings</p><h3>${KQApp.fmtPKR(wTot)}</h3></div><div class="icon-bubble"><i class="bi bi-wallet2"></i></div></div>
        <div class="card stat"><div><p>Monthly Earnings</p><h3>${KQApp.fmtPKR(mTot)}</h3></div><div class="icon-bubble"><i class="bi bi-graph-up"></i></div></div>
        <div class="card stat"><div><p>Completed Orders</p><h3>${done.length}</h3></div><div class="icon-bubble"><i class="bi bi-check2-circle"></i></div></div>`;
      document.getElementById("tbl").innerHTML = `<thead><tr><th>Order</th><th>Date</th><th>Customer</th><th>Mode</th><th>Net</th></tr></thead><tbody>` +
        done.map(o => `<tr><td>${o.id}</td><td>${o.date.slice(0,10)}</td><td>${o.customer}</td><td>${o.payment}</td><td>${KQApp.fmtPKR(o.net)}</td></tr>`).join("") + "</tbody>";

      document.getElementById("xlsxBtn").onclick = () => {
        const rows = [["Order ID","Date","Customer","Payment","Subtotal","Discount","Delivery","Tax","Net"]];
        done.forEach(o => rows.push([o.id,o.date.slice(0,10),o.customer,o.payment,o.subtotal,o.discount,o.delivery,o.tax,o.net]));
        const csv = rows.map(r => r.join(",")).join("\n");
        const blob = new Blob(["\uFEFF"+csv], { type: "text/csv;charset=utf-8;" });
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = "KitchenQueen-Orders-Summary.csv";
        a.click();
        KQApp.toast("Excel-ready CSV downloaded");
      };
      document.getElementById("pdfBtn").onclick = () => {
        const w = window.open("", "_blank");
        w.document.write(`<!DOCTYPE html><html><head><title>Invoice</title>
          <style>body{font-family:Georgia,serif;padding:32px;color:#2a160c}h1{color:#c41e3a}table{width:100%;border-collapse:collapse;margin-top:16px}th,td{border-bottom:1px solid #eee;padding:8px;text-align:left}</style></head><body>
          <h1>Kitchen Queen</h1><p>North Nazimabad, Karachi<br>Invoice pack · ${new Date().toLocaleDateString()}</p>
          <table><tr><th>Order</th><th>Customer</th><th>Payment</th><th>Net</th></tr>
          ${done.map(o=>`<tr><td>${o.id}</td><td>${o.customer}</td><td>${o.payment}</td><td>PKR ${o.net}</td></tr>`).join("")}
          </table><p><strong>Total: PKR ${done.reduce((s,o)=>s+o.net,0)}</strong></p>
          <script>onload=()=>{print();}<`+"/script></body></html>");
        w.document.close();
      };
    });
  </script>
</body>
</html>
